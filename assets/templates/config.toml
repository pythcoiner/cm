# cm configuration file

# Claude model to use for agent spawning
# Options: "claude-sonnet-4-5-20250929", "claude-opus-4-5-20251101"
# model = "claude-sonnet-4-5-20250929"

# Maximum number of fix cycles per task before deferring
# Default: 5
# max_cycles = 5

# Working directory for build verification (relative to project root)
# Default: "."
# working_dir = "."

# Build commands to run for verification
# If empty or not specified, build verification is skipped entirely
# Example: ["cargo build", "cargo clippy"]
# build_commands = []

# Pricing overrides for `cm token` (USD per million tokens).
# Lookup order: exact model key → family substring → hardcoded default.
# Run `cm update-pricing` to refresh this section from LiteLLM's public dataset.
#
# [pricing.opus]
# input = 15.0
# output = 75.0
# cache_write = 18.75
# cache_read = 1.50
#
# [pricing.sonnet]
# input = 3.0
# output = 15.0
# cache_write = 3.75
# cache_read = 0.30
#
# [pricing.haiku]
# input = 0.8
# output = 4.0
# cache_write = 1.0
# cache_read = 0.08

# am fleet monitor integration: while cm runs agents, it streams progress
# and output over a Unix socket at <socket_dir>/cm-<pid>.sock.
# Default: enabled = true, socket_dir resolved from AM_SOCKET_DIR env,
# then [am] socket_dir below, then $XDG_RUNTIME_DIR/am.
# [am]
# enabled = true
# socket_dir = "/tmp/am-sockets"
