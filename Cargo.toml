[package]
name = "cm"
version = "0.1.0"
edition = "2024"
description = "Claude Code Manager - Automated agent coordination for software development"
authors = [""]
license = "MIT"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# TUI
ratatui = "0.26"
crossterm = "0.27"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
