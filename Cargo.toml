[package]
name = "cm"
version = "0.1.0"
edition = "2021"
description = "Claude Code Manager - Automated agent coordination for software development"
authors = [""]
license = "MIT"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
log = "0.4"
env_logger = "0.11"


# Signal handling
ctrlc = "3.4"

# Home directory resolution (used by `cm token`)
dirs = "5"

# HTTP client + format-preserving TOML editing (used by `cm update-pricing`)
ureq = { version = "2", features = ["json"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
